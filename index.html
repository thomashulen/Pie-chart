<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: transparent;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="pie" width="200" height="200"></canvas>

  <script>
    const canvas = document.getElementById('pie');
    const ctx = canvas.getContext('2d');
    const today = new Date();
    const start = new Date(today.getFullYear(), 0, 1);
    const end = new Date(today.getFullYear() + 1, 0, 1);
    const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
    const dayOfYear = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;

    const percentFilled = dayOfYear / totalDays;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 80;

    // Draw filled (black) slice
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.fillStyle = '#000';
    ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * percentFilled);
    ctx.fill();

    // Draw unfilled (white) slice
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.fillStyle = '#fff';
    ctx.arc(centerX, centerY, radius, -Math.PI / 2 + 2 * Math.PI * percentFilled, -Math.PI / 2 + 2 * Math.PI);
    ctx.fill();
  </script>
</body>
</html>
